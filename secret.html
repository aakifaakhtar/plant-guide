<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }

  .secret-wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
  }

  .secret-logo {
    width: 64px;
    height: 64px;
    margin-bottom: 22px;
    opacity: 0.9;
    cursor: pointer;
    animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .secret-logo.bursting {
    animation: spin 0.7s cubic-bezier(0.65, 0, 0.35, 1);
  }

  @keyframes spin {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .secret-wrap h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 7vw, 4.2rem);
    line-height: 1.1;
    margin: 0 0 14px;
    color: var(--paper);
    animation: pop 0.7s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .secret-wrap h1 .num {
    color: var(--gold);
  }

  .secret-wrap .signature {
    font-family: 'Work Sans', sans-serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(0.9rem, 2vw, 1.05rem);
    color: var(--moss-light);
    margin: 4px 0 0;
    text-transform: none;
    letter-spacing: normal;
    animation: pop 0.7s 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .secret-wrap p {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--moss-light);
    animation: pop 0.7s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .back-home {
    position: absolute;
    bottom: 28px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--moss-light);
    text-decoration: none;
    opacity: 0.6;
  }
  .back-home:hover { opacity: 1; color: var(--paper); }

  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 9px;
    height: 14px;
    opacity: 0.95;
    will-change: transform, top;
    z-index: 10;
  }

  .audio-toggle {
    position: fixed;
    top: 22px;
    right: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--ink-soft);
    border: 1px solid rgba(233,226,207,0.18);
    color: var(--gold);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.8;
    z-index: 20;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .audio-toggle:hover { opacity: 1; transform: scale(1.06); }
</style>
</head>
<body>

<div class="secret-wrap">
  <img class="secret-logo" id="secretLogo" src="images/laila-logo.png" alt="click me">
  <h1>HAPPY <span class="num">22nd</span><br>BIRTHDAY LAILA</h1>
  <p class="signature">Love, Aakifa &amp; Irina</p>
  <a class="back-home" href="index.html">← back to the plant guide</a>
</div>

<audio id="bgAudio" src="audio/22.mp3" preload="auto"></audio>
<button id="audioToggle" class="audio-toggle" aria-label="toggle music">⏸</button>

<script>
(function () {
  function randomColor() {
    // fully random, vivid, not tied to the site palette
    var hue = Math.floor(Math.random() * 360);
    var sat = 70 + Math.random() * 30;
    var light = 50 + Math.random() * 15;
    return 'hsl(' + hue + ', ' + sat + '%, ' + light + '%)';
  }

  function launchConfetti(count) {
    for (var i = 0; i < count; i++) {
      setTimeout(function () {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        var left = Math.random() * 100;
        var duration = 2.6 + Math.random() * 1.8;
        var rotateStart = Math.random() * 360;
        var rotateEnd = rotateStart + (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 540);
        var drift = (Math.random() - 0.5) * 220;
        var width = 6 + Math.random() * 4;
        var height = width * (2.2 + Math.random() * 1.3);

        piece.style.left = left + 'vw';
        piece.style.background = randomColor();
        piece.style.width = width + 'px';
        piece.style.height = height + 'px';
        piece.style.borderRadius = '1px';
        piece.style.transform = 'rotate(' + rotateStart + 'deg)';

        document.body.appendChild(piece);

        var animation = piece.animate([
          { top: '-20px', transform: 'translateX(0) rotate(' + rotateStart + 'deg)', opacity: 1 },
          { top: '108vh', transform: 'translateX(' + drift + 'px) rotate(' + rotateEnd + 'deg)', opacity: 0.85 }
        ], {
          duration: duration * 1000,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        });

        animation.onfinish = function () {
          piece.remove();
        };
      }, Math.random() * 400);
    }
  }

  function burstConfetti() {
    launchConfetti(140);
    setTimeout(function () { launchConfetti(60); }, 700);
  }

  burstConfetti();

  var logo = document.getElementById('secretLogo');
  logo.addEventListener('click', function () {
    if (logo.classList.contains('bursting')) return;
    logo.classList.add('bursting');
    burstConfetti();
  });
  logo.addEventListener('animationend', function (e) {
    if (e.animationName === 'spin') {
      logo.classList.remove('bursting');
    }
  });

  // --- background song ---
  var audio = document.getElementById('bgAudio');
  var audioBtn = document.getElementById('audioToggle');

  audio.addEventListener('play', function () {
    audioBtn.textContent = '⏸';
    removeUnlockListeners();
  });
  audio.addEventListener('pause', function () {
    audioBtn.textContent = '▶';
  });

  audio.addEventListener('loadedmetadata', function () {
    audio.currentTime = 40;
    // try right away — works in some browsers, especially if this page
    // was reached by clicking a link (counts as recent interaction)
    audio.play().catch(function () {});
  });

  // if it plays all the way through, loop back to the very beginning
  audio.addEventListener('ended', function () {
    audio.currentTime = 0;
    audio.play();
  });

  // fallback: browsers block audio until there's been an interaction
  // on this exact page, so start it the instant she clicks anything
  function unlockAudio() {
    if (audio.paused) {
      audio.play().catch(function () {});
    }
  }
  function removeUnlockListeners() {
    document.removeEventListener('click', unlockAudio);
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('keydown', unlockAudio);
  }
  document.addEventListener('click', unlockAudio);
  document.addEventListener('touchstart', unlockAudio);
  document.addEventListener('keydown', unlockAudio);

  audioBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  });
})();
</script>

</body>
</html>
