<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }

  .secret-wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
  }

  .secret-logo {
    width: 64px;
    height: 64px;
    margin-bottom: 22px;
    opacity: 0.9;
    animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .secret-wrap h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 7vw, 4.2rem);
    line-height: 1.1;
    margin: 0 0 14px;
    color: var(--paper);
    animation: pop 0.7s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .secret-wrap h1 .num {
    color: var(--gold);
  }

  .secret-wrap p {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--moss-light);
    animation: pop 0.7s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .back-home {
    position: absolute;
    bottom: 28px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--moss-light);
    text-decoration: none;
    opacity: 0.6;
  }
  .back-home:hover { opacity: 1; color: var(--paper); }

  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 9px;
    height: 14px;
    opacity: 0.95;
    will-change: transform, top;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="secret-wrap">
  <img class="secret-logo" src="images/laila-logo.png" alt="">
  <h1>HAPPY <span class="num">22nd</span><br>BIRTHDAY LAILA</h1>
  <p>The plants know too 🌿</p>
  <a class="back-home" href="index.html">← back to the plant guide</a>
</div>

<script>
(function () {
  var colors = ['#c9a24b', '#a85c32', '#7c9a79', '#e9e2cf', '#4f6b52'];

  function launchConfetti(count) {
    for (var i = 0; i < count; i++) {
      setTimeout(function () {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        var left = Math.random() * 100;
        var color = colors[Math.floor(Math.random() * colors.length)];
        var duration = 2.6 + Math.random() * 1.8;
        var rotateStart = Math.random() * 360;
        var rotateEnd = rotateStart + (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 540);
        var drift = (Math.random() - 0.5) * 220;
        var shape = Math.random() > 0.5 ? '50%' : '2px';

        piece.style.left = left + 'vw';
        piece.style.background = color;
        piece.style.borderRadius = shape;
        piece.style.transform = 'rotate(' + rotateStart + 'deg)';

        document.body.appendChild(piece);

        var animation = piece.animate([
          { top: '-20px', transform: 'translateX(0) rotate(' + rotateStart + 'deg)', opacity: 1 },
          { top: '108vh', transform: 'translateX(' + drift + 'px) rotate(' + rotateEnd + 'deg)', opacity: 0.85 }
        ], {
          duration: duration * 1000,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        });

        animation.onfinish = function () {
          piece.remove();
        };
      }, Math.random() * 400);
    }
  }

  launchConfetti(140);
  setTimeout(function () { launchConfetti(60); }, 700);
})();
</script>

</body>
</html>
